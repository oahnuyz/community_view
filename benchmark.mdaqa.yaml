# MDAQA 前 100 条 QA：143 篇 PDF，共享一次文档入库与社区构建。
dataset_dir: data/benchmarks/mdaqa_first_100 # 服务器 prepared 数据的原样副本。
output_dir: data/runs/mdaqa_first_100_naive_community # 独立实验输出，不覆盖此前结果。
database: data/runs/mdaqa_first_100_naive_community/index.sqlite3 # 独立数据库，编号从 D0001 开始。
log_file: data/runs/mdaqa_first_100_naive_community/run.log # 入库、聚类、问答与评分日志。
start: 0 # 按准备好的 QA 文件顺序取样。
count: 100 # 100 条 QA 全部执行。
modes: [naive, community] # 两种模式分别问答和 LLM judge。
concurrency: 5 # 问答与评分并发；其余并发由 config.yaml 控制，当前也为 5。
