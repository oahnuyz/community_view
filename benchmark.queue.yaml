# 四个数据集独立重新入库；PaperScope 按三类汇总，共六组 naive/community 对照。
config: config.yaml # 所有阶段使用当前模型配置和 max_documents=6。
output_dir: data/queues/unified_prompts # 本批次独立队列状态、日志和退出码。
continue_on_error: true # 当前数据集失败仍继续后续数据集。
stages: [all] # 依次重新入库、构建社区、问答、评分。
experiments:
  - benchmark.scholarqa.yaml # 413 文档，92 QA。
  - benchmark.enterprise.yaml # 323 TXT，80 QA。
  - benchmark.paperscope.yaml # 93 PDF，352 QA：gap 119、results_comparison 116、trend 117。
  - benchmark.mdaqa.yaml # 143 PDF，100 QA。
