# 所有相对路径均以本配置文件所在目录为基准。
# 建议复制为 config.local.yaml 后填写实际服务和模型；两个密钥独立存放在 keys_file。
# 下列值为当前仓库默认配置；实际服务和实验路径请在本地副本中填写。

keys_file: api_keys.yaml # 两个 API 密钥的独立 YAML 文件，不会写入实验配置快照中的密钥值。

# 本地存储：无需单独启动数据库服务。
storage:
  database: data/community_view.sqlite3 # SQLite 文件：文档、chunks、图、社区、调用记录和问答轨迹。
  log_file: data/community_view.log # 运行日志路径；含失败文档及无法继续拆分的社区。
  log_level: INFO # 日志详细程度：DEBUG / INFO / WARNING / ERROR。

# 生成模型：文档 overview、社区描述、Agent 和评分共用此服务。
# 请求不传 max_tokens / max_completion_tokens，输入窗口与输出 token 上限采用 API 服务端默认值。
model:
  base_url: http://127.0.0.1:18080/v1 # OpenAI-compatible 服务根地址；程序追加 /chat/completions。
  chat_model: deepseek-v4-flash # 服务中的模型名称；需支持原生工具调用和结构化 JSON 输出。
  timeout_seconds: 300 # HTTP 请求超时秒数；生成和 embedding 请求共用。
  concurrency: 5 # 所有生成请求共享的最大并发数；文档与社区还有各自并发限制。
  retries: 2 # API 请求失败后的额外重试次数，范围 0~2；HTTP 错误和传输错误均适用，逐次记日志。
  retry_delay_seconds: 1 # 重试等待的起始秒数，后续按 2 倍递增。
  temperature: 0.0 # 生成温度，越低通常越稳定；应设置为实际模型支持的值。
  structured_output: json_schema # json_schema 使用严格 schema；json_object 仍执行本地格式和长度校验。
  extra_body: {} # 服务特有的附加请求字段；不允许覆盖 model、messages、tools 等已配置字段。

# 向量模型：为文档 overview、原文 chunks、搜索 query 生成归一化向量。
# 不在本地检查 embedding 输入 token 上限，由 API 服务端处理。
embedding:
  api_format: multimodal # openai：字符串批量输入；multimodal：逐条文本对象输入、单向量返回（当前代理的豆包视觉向量接口）。
  base_url: http://127.0.0.1:18080/v1 # embedding 服务根地址；程序追加 /embeddings，可与生成服务不同。
  model: doubao-embedding-vision # embedding 模型名称；更换模型/地址/维数后需用新数据库重建。
  dimensions: 1024 # null 使用模型原生维数；仅在服务支持 dimensions 参数时填写正整数。
  batch_size: 32 # openai 格式单次请求的文本条数；multimodal 每条文本独立请求，不使用该值。
  concurrency: 5 # 并发 embedding HTTP 请求数，与生成模型的并发限制独立。

# 原文读取与切片。
text:
  encoding: cl100k_base # tiktoken 编码名；应尽量匹配实际模型，否则 token 数只是近似值。
  extensions: [.txt, .md, .markdown, .pdf] # 接受的文件扩展名；目录递归扫描，PDF 需有可提取文字层。
  chunk_tokens: 600 # 每个原文 chunk 的 token 上限；不额外存页码或章节信息。
  chunk_overlap_tokens: 80 # 相邻 chunk 的目标重叠量，必须小于 chunk_tokens；Unicode 边界可能略缩短。
  pdf:
    strategy: auto # auto 首先使用本地 pdfplumber；当前不自动调用 LLM/VLM 或 OCR，亦可显式填 pdfplumber。
    max_heading_level: 4 # 书签和字体推断得到的 Markdown 标题最多四级。
    heading_min_size_ratio: 1.1 # 无可用书签时，候选标题字号至少为该页主要正文字号的此倍数。
    heading_max_chars: 160 # 字体推断标题的最大字符数，降低把正文误判成标题的概率。
    extract_tables: true # 逐页提取表格并附为 Markdown；正文中的表格文字可能与此重复。
    table_settings: {} # 传给 pdfplumber extract_tables 的参数；空对象使用库默认值。

# 文档 overview：title、keywords、summary；长度均按 Unicode 字符数计算。
overview:
  concurrency: 5 # 同时处理的文档数；不同文档可并发，同一文档的长文分片顺序处理。
  fragment_tokens: 10000 # 原文分片 token 上限；完整请求还包含累计信息、指令和 schema，需预留窗口。
  title_max_chars: 160 # 文档 title 最大字符数。
  summary_target_min_chars: 300 # 摘要建议长度下界；不作为必须填满的最小长度。
  summary_max_chars: 350 # 写作目标上界，同时用于 prompt/API schema；目标区间 300–350 字符。
  summary_validation_max_chars: 450 # 程序实际硬上限；超限带具体错误反馈重试，不截断。
  keyword_count: 12 # 关键词数量上限；至少 1 个，规范化后不可重复。
  keyword_max_chars: 80 # 每个关键词或关键词短语的最大字符数。
  stage_max_chars: 2400 # 非最后分片返回的累计综合信息上限；传给下一片继续综合。
  validation_retries: 2 # JSON、字段或长度校验失败后，要求模型修正的额外次数。

# 文档图：此模式与下方 chunk 搜索模式相互独立。
graph:
  mode: hybrid # vector：文档向量；keyword：关键词短语 TF-IDF；hybrid：两者混合。
  neighbor_k: 15 # 每篇文档在每个启用通道取前 k 个正相似度邻居；混合模式取两路候选并集。
  min_weight: 0.25 # 候选边最低保留权重；零权重始终排除，所有通过筛选的边均保存。
  vector_weight: 0.7 # 混合权重 α：α*正向量余弦+(1-α)*关键词余弦；单通道模式不使用。

# 层次社区：所有社区都生成描述，当前检索只使用叶社区。
community:
  max_documents: 6 # 覆盖文档数超过该值即尝试拆分；失败记日志并保留叶社区，不强制满足阈值。
  llm_split_fallback: false # 超阈值且 Leiden 无法拆分时，允许 LLM 拆分一次；可选择不拆，生成的子社区不再拆分。
  cluster_workers: 5 # 不同分支的 Leiden 聚类进程数；可与社区描述生成同时进行。
  resolution: 1.0 # Leiden RB modularity 分辨率；更高通常倾向更小社区，但不保证指定大小。
  seed: 42 # Leiden 随机种子；相同数据和库版本下便于复现。
  iterations: -1 # -1 表示迭代至收敛，也可填写正整数；不允许 0。
  description_concurrency: 5 # 社区 name/overview 和可选 LLM 拆分请求共用的并发上限，还受 model.concurrency 限制。
  name_max_chars: 100 # 社区名称最大字符数。
  overview_target_min_chars: 150 # 社区 overview 建议长度下界；不强制填满。
  overview_max_chars: 200 # 写作目标上界及 prompt/API schema 上限；目标区间 150–200 字符。
  overview_validation_max_chars: 250 # 程序实际硬上限；超限带错误反馈重试。
  validation_retries: 2 # 社区描述或 LLM 拆分响应校验失败后的额外修正次数，最多两次；拆分最终失败则保留原叶社区。

# 在线检索：doc_ids 只约束原文 chunk 范围，自动社区扩展不受该范围限制。
retrieval:
  mode: naive # naive：chunk+文档概览；community：再扩展社区；fallback 由 community.llm_split_fallback 控制。
  search_mode: vector # 默认 chunk 搜索方式：vector / keyword / hybrid，可被工具参数或 CLI 覆盖。
  chunk_k: 12 # 每次搜索最终返回的 chunk 数量上限。
  doc_k: 3 # 按 chunk 排名首次出现顺序选前 k 个不同文档，用于本体叶社区及最大关联边扩展。
  fusion_candidates: 40 # 混合搜索每路候选数量；实际至少为 chunk_k，再通过 RRF 融合。
  rrf_constant: 60 # RRF 平滑常数：融合分数为各路 1/(该常数+排名) 之和，排名从 1 开始。
  min_vector_similarity: 0.0 # chunk 向量搜索最低余弦相似度；不影响关键词路或文档建图阈值。
  bm25_k1: 1.5 # BM25 词频饱和参数；越大，较高词频通常能带来更多加分。
  bm25_b: 0.75 # BM25 长度归一化强度，范围 0~1；0 表示不进行长度归一化。
  bm25_epsilon: 0.25 # BM25Okapi 负 IDF 替换系数，乘以语料的平均 IDF。
  read_chunk_limit: 10 # 底层按编号读取接口的上限（编号从 0 开始）；Agent 不提供此工具。

# 两种检索模式共用 Agent；去重集合覆盖一次用户问题的全部轮次，新问题重置。
agent:
  tool_concurrency: 5 # 单个问题同一轮最多并发执行的工具数；1 为串行，embedding 请求仍受 embedding.concurrency 限制。
  max_rounds: 15 # 单个问题最多模型调用轮数；最后一轮禁止工具调用，只生成最终回答。
  max_identical_tool_calls: 2 # 同一次问题中，相同工具和参数最多执行次数；超过后返回工具错误。

# 可选问题视图：记录历史、提炼问题、逐题编译和按需读取。
knowledge:
  record_questions: false # 独立开关：记录外部问题与实际展示过的叶社区；编译内部问题不进入历史。
  use_compiled: false # 独立开关：匹配提炼问题、展示view问题目录并允许读取答案；关闭时无新知识说明或工具。
  concurrency: 3 # 不同社区的提炼、编译并发上限；每个社区内逐题运行独立agent loop。
  question_k: 5 # 向量匹配的前k个提炼问题；取其所属社区，展示社区view中的完整问题目录。
  min_question_similarity: 0.0 # 问题向量余弦最低阈值；零或负相似度始终排除。
  read_answer_limit: 8 # read_view_answers一次最多选择的答案数，跨调用按问题独立去重。
  validation_retries: 2 # 非法问题集（如重复问题、未知来源ID）带错误反馈的最大修正次数。
  plan_prompt: prompts/knowledge_plan.txt # 根据社区及成员文档信息筛选、压缩、去重历史问题。
  context_prompt: prompts/knowledge_context.txt # 只向启用新知识的问答说明view目录及答案读取工具。

# 可单独编辑的指令模板，路径相对本 YAML 文件。
prompts:
  document: prompts/document.txt # 文档逐片累计综合及最后一片生成全文 overview 的指令。
  community: prompts/community.txt # 基于全部覆盖文档 overview 生成社区短名称和总览的指令。
  community_split: prompts/community_split.txt # 仅启用 llm_split_fallback 且 Leiden 无法拆分时使用，不注入 QA 上下文。
  agent: prompts/agent.txt # Agent 检索、读取、去重信息使用及回答行为指令。
  question: prompts/question.txt # 每题初始用户 prompt 模板，使用 {question} 插入原始问题。
  judge: prompts/judge.txt # LLM 评分 prompt；评分模型和并发复用问答设置，输出上限采用服务端默认值。
